spring.application.name=pet-shelter-project

server.port=80

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.hikari.username=pet_admin
spring.datasource.hikari.password=pet_admin

spring.datasource.url=jdbc:log4jdbc:mysql://localhost:3306/pet_shelter_project
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy

mybatis.type-aliases-package=com.shelter.app

mybatis.configuration.map-underscore-to-camel-case=true